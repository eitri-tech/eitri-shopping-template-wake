# App: 'EITRI-SHOP-TEMPLATE-WAKE'
# DLK: 0647a5dd-5d7b-4ea1-888d-d86e05433f14
# balaroti: 8f330ee9-2436-4b90-959b-e0f940a3a741
application-id: 8f330ee9-2436-4b90-959b-e0f940a3a741
bottom-tab-view-simulation:
    eitri-apps:
        - slug: 'home'
          title: 'Inicio'
          initialization-params:
              type: 'string'
              value: 'tabIndex=0'
        - slug: 'home'
          title: 'Categorias'
          initialization-params:
              type: 'string'
              value: 'tabIndex=1&route=Categories'
        - slug: 'cart'
          title: 'Carrinho'
          initialization-params:
              type: 'string'
              value: 'tabIndex=2'
        - slug: 'account'
          title: 'Perfil'
          initialization-params:
              type: 'string'
              value: 'tabIndex=3'
    layout:
        layout:
            theme: 'classic'
            backgroundColor: '#FFFFFF'
            selectedColor: '#373737'
            unselectedColor: '#8B8D98'
            badgeBackground: '#E5484D'
            badgeTextColor: '#FFFFFF'
            themeCustomizations:
                classic:
                    labels: 'shown'
                    topBorder:
                        thickness: 1
                        color: '#DBDDE0'
        eitriApps:
            - title: 'Inicio'
              icon: 'https://media-eitri-content.eitri.tech/default/icon_home_v1.png'
            - title: 'Categorias'
              icon: 'https://media-eitri-content.eitri.tech/default/icon_menu_v1.png'
            - title: 'Carrinho'
              icon: 'https://media-eitri-content.eitri.tech/default/icon_cart_v1.png'
            - title: 'Perfil'
              icon: 'https://media-eitri-content.eitri.tech/default/icon_user_v1.png'
eitri-apps:
    - path: ./shopping-wake-template-shared
      workspace: shopping-wake-template-shared
      alias: shared
      focus: false
      shared: true
    - path: ./shopping-wake-template-home
      workspace: shopping-wake-template-home
      alias: home
      focus: true
      shared: false
    - path: ./shopping-wake-template-pdp
      workspace: shopping-wake-template-pdp
      alias: pdp
      focus: false
      shared: false
    - path: ./shopping-wake-template-cart
      workspace: shopping-wake-template-cart
      alias: cart
      focus: false
      shared: false
    - path: ./shopping-wake-template-checkout
      workspace: shopping-wake-template-checkout
      alias: checkout
      focus: false
      shared: false
    - path: ./shopping-wake-template-account
      workspace: shopping-wake-template-account
      alias: account
      focus: false
      shared: false
check-js: false
